name: Build Windows Desktop App

on:
  workflow_dispatch: # 支持网页端手动一键触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出源码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装打包与运行依赖
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pillow torch torchvision timm albumentations transformers pyinstaller
        pip install -e .

    - name: 运行自动打包脚本
      run: |
        python build_exe.py

    - name: 上传构建产物 (EXE 安装包)
      uses: actions/upload-artifact@v4
      with:
        name: UniMERNet-Windows-Portable
        path: dist/